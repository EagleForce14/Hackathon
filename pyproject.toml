[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinson"
version = "0.1.0"
description = "Workspace package for the parkinson ML experiments."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
